name: OSS Doctor
description: Audit open-source repository health and publish a concise CI summary
author: LittleCurry
branding:
  icon: check-circle
  color: purple
inputs:
  path:
    description: Repository path to audit
    required: false
    default: .
  fail-under:
    description: Fail the workflow when the score is below this value (0-100)
    required: false
    default: "0"
  python-version:
    description: Python version used to run OSS Doctor
    required: false
    default: "3.12"
outputs:
  score:
    description: Repository health score from 0 to 100
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install OSS Doctor
      shell: bash
      run: python -m pip install --disable-pip-version-check "${{ github.action_path }}"
    - name: Audit repository
      shell: bash
      env:
        AUDIT_PATH: ${{ inputs.path }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -euo pipefail
        oss-doctor check "$AUDIT_PATH" --format json --output "$RUNNER_TEMP/oss-doctor.json"
        score="$(python -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/oss-doctor.json"))["score"])')"
        echo "score=$score" >> "$GITHUB_OUTPUT"
        oss-doctor check "$AUDIT_PATH" --format markdown --output "$RUNNER_TEMP/oss-doctor.md"
        {
          echo "## 🩺 OSS Doctor: $score/100"
          echo
          cat "$RUNNER_TEMP/oss-doctor.md"
        } >> "$GITHUB_STEP_SUMMARY"
        oss-doctor check "$AUDIT_PATH" --fail-under "$FAIL_UNDER" --no-color
